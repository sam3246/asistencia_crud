<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Asistencia</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #fdf8ef 0%, #eaf6ef 100%);
        color: #3d4a43;
        margin: 0;
        padding: 40px 16px;
        min-height: 100vh;
    }

    h1 {
        text-align: center;
        font-size: 1.7rem;
        font-weight: 700;
        margin: 0 0 26px;
        color: #2f6b55;
        letter-spacing: 0.01em;
    }

    form {
        max-width: 480px;
        margin: 0 auto;
        background: #fffdf9;
        padding: 36px 32px 32px;
        border-radius: 22px;
        border: 1px solid #e6efe8;
        border-top: 6px solid #8fd3b6;
        box-shadow: 0 12px 32px rgba(94, 160, 130, 0.15);
    }

    .form-group {
        margin-bottom: 18px;
    }

    .fecha {
        width: 100%;
        height: 44px;
        border-radius: 10px;
        border: 1px solid #d5e8dc;
        border-left: 4px solid #a8dcc4;
        color: #34453c;
        background: #f3faf6;
        padding-left: 12px;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .fecha:focus {
        outline: none;
        background: #ffffff;
        border-color: #8fd3b6;
        box-shadow: 0 0 0 3px rgba(143, 211, 182, 0.35);
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6aa88c;
    }

    input[type="text"] {
        width: 100%;
        padding: 11px 14px;
        font-family: inherit;
        font-size: 1rem;
        color: #34453c;
        background: #f3faf6;
        border: 1px solid #d5e8dc;
        border-left: 4px solid #a8dcc4;
        border-radius: 10px;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="text"]:focus {
        outline: none;
        background: #ffffff;
        border-color: #8fd3b6;
        box-shadow: 0 0 0 3px rgba(143, 211, 182, 0.35);
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        background: #f59a84;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(245, 154, 132, 0.4);
        transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn-submit:hover {
        background: #ee8068;
        box-shadow: 0 6px 16px rgba(238, 128, 104, 0.45);
    }

    .btn-submit:active {
        transform: scale(0.97);
    }

    .back-link {
        display: block;
        margin-top: 18px;
        text-align: center;
        font-size: 0.9rem;
        color: #7a8f84;
        text-decoration: none;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #2f6b55;
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        form {
            padding: 28px 18px 24px;
        }
    }
</style>
</head>
<body>

    <h1>{% if Asistencia %}Editar{% else %}Nuevo{% endif %} Asistencia</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="tipo_documento">Tipo de Documento</label>
            <input type="text" id="tipo_documento" name="tipo_documento" value="{{ Asistencia.tipo_documento|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="documento">Documento</label>
            <input type="text" id="documento" name="documento" value="{{ Asistencia.documento|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="nombres">Nombres</label>
            <input type="text" id="nombres" name="nombres" value="{{ Asistencia.nombres|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" value="{{ Asistencia.apellidos|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" name="whatsapp" value="{{ Asistencia.whatsapp|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" class="fecha" id="fecha" name="fecha" value="{{ Asistencia.fecha|default:'' }}" required>
        </div>

        <div class="form-group">
            <label for="asistencia">Asistencia</label>
            <select name="asistencia" id="asistencia" class="fecha" required>
                <option value="">Seleccione una Opción</option>
                <option value="True" {% if Asistencia.asistencia == "True" %}selected{% endif %}>Presente</option>
                <option value="False" {% if Asistencia.asistencia == "False" %}selected{% endif %}>Ausente</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Guardar</button>
        <a href="/asistencia/lista/" class="back-link">Cancelar y volver</a>
    </form>

</body>
</html>
